[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdownloader"
version = "1.2.2"
description = "Production-grade YouTube indirici masaüstü uygulaması"
requires-python = ">=3.11"

dependencies = [
    "yt-dlp>=2024.1.0",
    "PyQt6>=6.5",
    "PyQt6-WebEngine>=6.5",   # YouTube sekmesi (yoksa sekme devre dışı kalır)
    "certifi",                # yt-dlp'nin SSL sertifika doğrulaması için
    "mutagen",                # yt-dlp kapak resmi / etiket gömme (opsiyonel kullanım)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "pre-commit>=3.5",
    "pip-audit>=2.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ytdownloader*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["ytdownloader/tests"]
addopts = "-v --tb=short"
